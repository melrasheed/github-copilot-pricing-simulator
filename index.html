<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GitHub Copilot Usage-Based Billing Simulator</title>
<meta name="description" content="An offline, documentation-grounded educational simulator for GitHub Copilot usage-based billing, budgets, and spending controls." />
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
/* styles.css — Clawpilot theme + simulator UI. Colors use only var(--cp-*). */
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--cp-bg);
  color: var(--cp-text);
  font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 14px;
  line-height: 1.5;
}
code, pre, .mono { font-family: Consolas, "Courier New", Courier, monospace; }
a { color: var(--cp-link); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0 0 0.5rem; font-weight: 600; }
h1 { font-size: 1.4rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0 0 0.75rem; }
small { color: var(--cp-text-muted); }

/* Layout */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 240px; flex-shrink: 0; background: var(--cp-bg-elevated);
  border-right: 1px solid var(--cp-border); padding: 1rem; position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 0.25rem; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
.brand .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--cp-accent); }
.brand strong { font-size: 0.95rem; }
.nav-btn {
  text-align: left; background: transparent; border: none; color: var(--cp-text);
  padding: 0.55rem 0.7rem; border-radius: 0.625rem; cursor: pointer; font-size: 0.9rem; width: 100%;
}
.nav-btn:hover { background: var(--cp-surface-soft); }
.nav-btn.active { background: var(--cp-accent-soft); color: var(--cp-accent); font-weight: 600; }
.sidebar .spacer { flex: 1; }
.main { flex: 1; padding: 1.5rem 2rem; max-width: 1200px; margin: 0 auto; width: 100%; }
.view-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }

/* Cards */
.card {
  background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 16px;
  padding: 1.1rem 1.25rem; margin-bottom: 1rem;
  box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
}
.card h3 { display: flex; align-items: center; gap: 0.5rem; }
.grid { display: grid; gap: 1rem; }
.grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }

/* Stat tiles */
.stat { background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 16px; padding: 0.9rem 1rem; }
.stat .label { color: var(--cp-text-muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
.stat .value { font-size: 1.5rem; font-weight: 600; margin-top: 0.15rem; }
.stat .sub { font-size: 0.8rem; color: var(--cp-text-soft); }

/* Progress bar */
.bar { height: 8px; border-radius: 6px; background: var(--cp-surface-soft); overflow: hidden; margin-top: 0.4rem; }
.bar > span { display: block; height: 100%; background: var(--cp-accent); }
.bar.warn > span { background: var(--cp-warning); }
.bar.danger > span { background: var(--cp-danger); }

/* Forms */
label.field { display: block; margin-bottom: 0.7rem; font-size: 0.85rem; }
label.field > span { display: block; color: var(--cp-text-muted); margin-bottom: 0.2rem; }
input, select, textarea {
  width: 100%; padding: 0.45rem 0.6rem; border: 1px solid var(--cp-border-strong);
  border-radius: 0.625rem; background: var(--cp-bg-elevated); color: var(--cp-text); font: inherit;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--cp-accent); outline-offset: 1px; border-color: var(--cp-accent); }
.row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: flex-end; }
.row > * { flex: 1; min-width: 140px; }
.inline { display: flex; align-items: center; gap: 0.4rem; }
.inline input[type="checkbox"] { width: auto; }

/* Buttons */
button.btn {
  background: var(--cp-accent); color: var(--cp-accent-fg); border: none; padding: 0.5rem 0.95rem;
  border-radius: 0.625rem; cursor: pointer; font: inherit; font-weight: 600;
}
button.btn:hover { background: var(--cp-accent-hover); }
button.btn.ghost { background: transparent; color: var(--cp-accent); border: 1px solid var(--cp-border-strong); }
button.btn.ghost:hover { background: var(--cp-accent-soft); }
button.btn.small { padding: 0.3rem 0.6rem; font-size: 0.8rem; }
button.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--cp-border); vertical-align: top; }
th { color: var(--cp-text-muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.02em; }
tbody tr:hover { background: var(--cp-surface-soft); }
.table-wrap { overflow-x: auto; }

/* Badges */
.badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.72rem; font-weight: 600; }
.badge.ok { background: rgba(22,163,74,0.14); color: var(--cp-success); }
.badge.block { background: rgba(220,38,38,0.14); color: var(--cp-danger); }
.badge.meter { background: var(--cp-accent-soft); color: var(--cp-accent); }
.badge.warn { background: rgba(245,158,11,0.16); color: var(--cp-warning); }
.badge.neutral { background: var(--cp-surface-soft); color: var(--cp-text-muted); }

/* Doc chips */
.doc-link { font-size: 0.72rem; color: var(--cp-link); border: 1px solid var(--cp-border); border-radius: 999px; padding: 0.05rem 0.45rem; margin-left: 0.35rem; }
.doc-link::before { content: "\1F4C4 "; }
.pill { display:inline-block; background: var(--cp-surface-soft); border:1px solid var(--cp-border); border-radius:999px; padding:0.1rem 0.55rem; font-size:0.75rem; margin:0 0.25rem 0.25rem 0; }

/* Banner */
.banner { border-radius: 12px; padding: 0.7rem 1rem; margin-bottom: 1rem; font-size: 0.85rem; border: 1px solid; }
.banner.highlight { background: var(--cp-accent-soft); border-color: var(--cp-accent); color: var(--cp-text); }
.banner.info { background: var(--cp-surface-soft); border-color: var(--cp-border); }
.banner.warn { background: rgba(245,158,11,0.12); border-color: var(--cp-warning); }

/* Outcome box */
.outcome { border-radius: 12px; padding: 1rem 1.1rem; border: 1px solid var(--cp-border); background: var(--cp-surface-soft); }
.outcome.ok { border-color: var(--cp-success); }
.outcome.block { border-color: var(--cp-danger); }
.outcome.meter { border-color: var(--cp-accent); }
.outcome .headline { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.3rem; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 0.15rem 0.9rem; font-size: 0.83rem; }
.kv dt { color: var(--cp-text-muted); }
.kv dd { margin: 0; }

.event-log { max-height: 340px; overflow-y: auto; }
.muted { color: var(--cp-text-muted); }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.hidden { display: none; }
.themed-toggle { margin-top: 0.5rem; }
details.rule { border: 1px solid var(--cp-border); border-radius: 10px; padding: 0.5rem 0.75rem; margin-bottom: 0.5rem; }
details.rule summary { cursor: pointer; font-weight: 600; }
.excerpt { font-style: italic; color: var(--cp-text-soft); margin: 0.25rem 0; }
.tag-list { display: flex; flex-wrap: wrap; gap: 0.25rem; }
.section-note { font-size: 0.8rem; color: var(--cp-text-muted); margin-top: -0.4rem; margin-bottom: 0.8rem; }

/* Config sub-navigation (GitHub-style tabs) */
.subnav { display: flex; gap: 0.25rem; border-bottom: 1px solid var(--cp-border); margin-bottom: 1.2rem; flex-wrap: wrap; }
.subnav button { background: transparent; border: none; padding: 0.55rem 0.9rem; cursor: pointer; color: var(--cp-text-muted); border-bottom: 2px solid transparent; font: inherit; }
.subnav button:hover { color: var(--cp-text); }
.subnav button.active { color: var(--cp-accent); border-bottom-color: var(--cp-accent); font-weight: 600; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: flex-start; justify-content: center; padding: 3rem 1rem; z-index: 50; overflow-y: auto; }
.modal { background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 16px; max-width: 580px; width: 100%; padding: 1.4rem 1.6rem; box-shadow: var(--cp-shadow); }
.modal h2 { margin-bottom: 1rem; font-size: 1.2rem; }
.modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.3rem; }
.radio-card { display: block; border: 1px solid var(--cp-border); border-radius: 10px; padding: 0.55rem 0.75rem; margin-bottom: 0.45rem; cursor: pointer; }
.radio-card.selected { border-color: var(--cp-accent); background: var(--cp-accent-soft); }
.radio-card.disabled { opacity: 0.55; cursor: not-allowed; }
.radio-card small { display: block; color: var(--cp-text-muted); margin-top: 0.15rem; }
.readonly-field { padding: 0.45rem 0.6rem; border: 1px dashed var(--cp-border-strong); border-radius: 0.625rem; background: var(--cp-surface-soft); color: var(--cp-text-muted); font-size: 0.85rem; }

/* Start here — educational primer */
.idea { display: flex; gap: 0.6rem; background: var(--cp-surface-soft); border: 1px solid var(--cp-border); border-radius: 12px; padding: 0.7rem 0.8rem; }
.idea-n { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; background: var(--cp-accent); color: var(--cp-accent-fg); display: flex; align-items: center; justify-content: center; font-weight: 700; }
.mini-card { background: var(--cp-surface-soft); border: 1px solid var(--cp-border); border-radius: 12px; padding: 0.8rem 1rem; }
.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0.5rem; margin-top: 0.6rem; }
.flow-step { flex: 1; min-width: 160px; background: var(--cp-surface-soft); border: 1px solid var(--cp-border); border-radius: 10px; padding: 0.6rem 0.8rem; }
.flow-arrow { align-self: center; color: var(--cp-text-muted); font-size: 1.3rem; }
.tick-list { margin: 0.4rem 0 0 1.1rem; padding: 0; }
.tick-list li { margin: 0.2rem 0; }
.inline-link { color: var(--cp-link); font-weight: 600; cursor: pointer; text-decoration: none; }
.inline-link:hover { text-decoration: underline; }

/* Simulator live meters — sticky so it stays visible while building requests */
.live-meters { position: sticky; top: 0.75rem; z-index: 5; border-color: var(--cp-accent); box-shadow: var(--cp-shadow); }
.meter-list { display: grid; gap: 0.55rem; margin-top: 0.9rem; }
.meter-row .meter-head { display: flex; justify-content: space-between; gap: 0.75rem; font-size: 0.82rem; margin-bottom: 0.12rem; }

/* Global disclaimer footer (shown on every view) */
.app-footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--cp-border); font-size: 0.8rem; color: var(--cp-text-muted); line-height: 1.5; }
@media (max-width: 780px) {
  .app { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: static; flex-direction: row; flex-wrap: wrap; }
  .sidebar .spacer { display: none; }
  .main { padding: 1rem; }
}

</style>
</head>
<body>
<div id="app"></div>
<script>
/*
 * data.js — Documentation-grounded reference data for the GitHub Copilot
 * usage-based billing simulator. All prices, constants, and rules cite an
 * official GitHub Docs / Changelog URL. Verified against live docs on
 * 2026-07-23. Pure data + no DOM access, so it is safe to load in Node.
 */
(function (global) {
  'use strict';

  // 1 AI credit = $0.01 USD.
  // Source: docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
  var CREDIT_TO_USD = 0.01;

  var CONSTANTS = {
    CREDIT_TO_USD: CREDIT_TO_USD,
    CB_INCLUDED_CREDITS: 1900,
    CE_INCLUDED_CREDITS: 3900,
    ALERT_THRESHOLDS_BUDGET: [0.75, 0.9, 1.0],
    ALERT_THRESHOLDS_INCLUDED_USAGE: [0.9, 1.0],
    // Included-usage email alerts are documented ONLY for these products.
    // Copilot AI credits are intentionally NOT in this list.
    INCLUDED_USAGE_ALERT_PRODUCTS: [
      'actions_minutes', 'actions_storage', 'packages_bandwidth', 'packages_storage',
      'lfs_bandwidth', 'lfs_storage', 'codespaces_core_hours', 'codespaces_storage'
    ],
    COST_CENTER_MAX_PER_ENTERPRISE: 500,
    COST_CENTER_MAX_RESOURCES: 25000,
    COST_CENTER_MAX_MUTATION_BATCH: 50,
    MAX_BUDGETS_PER_ACCOUNT: 10000,
    // Modifiers below are illustrative / not fully documented — see exclusions.
    AUTO_MODEL_DISCOUNT: 0.10,
    DATA_RESIDENCY_MULTIPLIER: 1.10
  };

  // Documentation reference catalog (canonical source list).
  var DOCS = {
    'billing-overview': { id: 1, url: 'https://docs.github.com/en/copilot/concepts/billing', title: 'Copilot billing concepts' },
    'ubb-individuals': { id: 2, url: 'https://docs.github.com/en/copilot/concepts/billing/usage-based-billing-for-individuals', title: 'Usage-based billing for individuals' },
    'ubb-orgs-ent': { id: 3, url: 'https://docs.github.com/en/copilot/concepts/billing/usage-based-billing-for-organizations-and-enterprises', title: 'Usage-based billing for organizations and enterprises' },
    'orgs-ent': { id: 4, url: 'https://docs.github.com/en/copilot/concepts/billing/organizations-and-enterprises', title: 'Copilot in organizations and enterprises' },
    'individual-plans': { id: 5, url: 'https://docs.github.com/en/copilot/concepts/billing/individual-plans', title: 'Individual plans' },
    'copilot-licenses': { id: 6, url: 'https://docs.github.com/en/billing/concepts/product-billing/github-copilot-licenses', title: 'GitHub Copilot licenses' },
    'billing-cycle': { id: 7, url: 'https://docs.github.com/en/copilot/reference/copilot-billing/billing-cycle', title: 'Billing cycle' },
    'models-pricing': { id: 8, url: 'https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing', title: 'Models and pricing' },
    'usage-limits': { id: 9, url: 'https://docs.github.com/en/copilot/concepts/usage-limits', title: 'Usage limits' },
    'budgets-ubb': { id: 10, url: 'https://docs.github.com/en/copilot/concepts/billing/budgets-for-usage-based-billing', title: 'Budgets for usage-based billing' },
    'budgets-alerts': { id: 11, url: 'https://docs.github.com/en/billing/concepts/budgets-and-alerts', title: 'Budgets and alerts' },
    'cost-centers': { id: 12, url: 'https://docs.github.com/en/billing/concepts/cost-centers', title: 'Cost centers' },
    'cost-center-allocation': { id: 13, url: 'https://docs.github.com/en/billing/reference/cost-center-allocation', title: 'Cost center allocation for different products' },
    'using-budgets': { id: 14, url: 'https://docs.github.com/billing/managing-your-billing/using-budgets-control-spending', title: 'Using budgets to control spending' },
    'getting-started-budgets': { id: 15, url: 'https://docs.github.com/en/copilot/tutorials/budgets/getting-started-with-budget-controls', title: 'Getting started with budget controls' },
    'optimizing-budgets': { id: 16, url: 'https://docs.github.com/en/copilot/tutorials/budgets/optimizing-your-budget-configuration', title: 'Optimizing your budget configuration' },
    'control-costs-scale': { id: 17, url: 'https://docs.github.com/en/billing/tutorials/control-costs-at-scale', title: 'Control costs at scale' },
    'soft-budgets': { id: 18, url: 'https://docs.github.com/en/enterprise-cloud@latest/billing/tutorials/soft-budgets', title: 'Start monitoring costs with soft budgets' },
    'manage-company-spending': { id: 19, url: 'https://docs.github.com/en/copilot/how-tos/manage-and-track-spending/manage-company-spending', title: 'Manage company spending' },
    'monitor-ai-usage': { id: 20, url: 'https://docs.github.com/en/copilot/how-tos/manage-and-track-spending/monitor-ai-usage', title: 'Monitor AI usage' },
    'set-session-limit': { id: 21, url: 'https://docs.github.com/copilot/how-tos/copilot-cli/use-copilot-cli/set-session-limit', title: 'Set Copilot CLI session limit' },
    'billing-reports': { id: 22, url: 'https://docs.github.com/en/billing/reference/billing-reports', title: 'Billing reports reference' },
    'gather-insights': { id: 23, url: 'https://docs.github.com/en/billing/tutorials/gather-insights', title: 'Gather insights' },
    'rest-budgets': { id: 24, url: 'https://docs.github.com/en/rest/billing/budgets', title: 'REST API: budgets' },
    'rest-cost-centers': { id: 25, url: 'https://docs.github.com/en/enterprise-cloud@latest/rest/billing/cost-centers', title: 'REST API: cost centers' },
    'manage-enterprise-policies': { id: 26, url: 'https://docs.github.com/en/enterprise-cloud@latest/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-enterprise-policies', title: 'Manage enterprise policies' },
    'set-up-budgets': { id: 36, url: 'https://docs.github.com/en/billing/how-tos/set-up-budgets', title: 'Set up budgets to control spending on metered products' }
  };

  function ref(key, excerpt) {
    var d = DOCS[key];
    if (!d) return { url: '', title: key, excerpt: excerpt || '' };
    return { key: key, url: d.url, title: d.title, excerpt: excerpt || '' };
  }

  // Model catalog — copied verbatim from the Models and pricing tables.
  // Prices are USD per 1,000,000 tokens. Verified 2026-07-23.
  // Source: DOCS['models-pricing']
  function m(provider, name, category, tier, threshold, input, cached, output, cacheWrite, status) {
    return {
      id: (name + (tier && tier !== 'Default' ? ' (' + tier + ')' : '')).replace(/\s+/g, '-').toLowerCase(),
      provider: provider, name: name, category: category, tier: tier || 'Default',
      thresholdInputTokens: threshold, // number or null (Default when model has tiers)
      inputPricePerMillion: input,
      cachedInputPricePerMillion: cached,
      cacheWritePricePerMillion: (cacheWrite === undefined ? null : cacheWrite),
      outputPricePerMillion: output,
      releaseStatus: status || 'GA'
    };
  }

  var MODELS = [
    // OpenAI
    m('OpenAI', 'GPT-5 mini', 'Lightweight', 'Default', null, 0.25, 0.025, 2.00),
    m('OpenAI', 'GPT-5.3-Codex', 'Powerful', 'Default', null, 1.75, 0.175, 14.00),
    m('OpenAI', 'GPT-5.4', 'Versatile', 'Default', 272000, 2.50, 0.25, 15.00),
    m('OpenAI', 'GPT-5.4', 'Versatile', 'Long context', 272000, 5.00, 0.50, 22.50),
    m('OpenAI', 'GPT-5.4 mini', 'Lightweight', 'Default', null, 0.75, 0.075, 4.50),
    m('OpenAI', 'GPT-5.4 nano', 'Lightweight', 'Default', null, 0.20, 0.02, 1.25),
    m('OpenAI', 'GPT-5.5', 'Powerful', 'Default', 272000, 5.00, 0.50, 30.00),
    m('OpenAI', 'GPT-5.5', 'Powerful', 'Long context', 272000, 10.00, 1.00, 45.00),
    m('OpenAI', 'GPT-5.6 Luna', 'Lightweight', 'Default', 200000, 1.00, 0.10, 6.00),
    m('OpenAI', 'GPT-5.6 Luna', 'Lightweight', 'Long context', 200000, 2.00, 0.20, 9.00),
    m('OpenAI', 'GPT-5.6 Sol', 'Powerful', 'Default', 272000, 5.00, 0.50, 30.00),

<script>
/*
 * engine.js — Pure, deterministic simulation engine for GitHub Copilot
 * usage-based billing. No DOM access. Every branch maps to a documented rule
 * (see data.js RULES). Loadable in Node for tests and in the browser bundle.
 */
(function (global) {
  'use strict';

  var DATA = global.SIM_DATA;
  var C = DATA.CONSTANTS;

  /* ----------------------------- date helpers ----------------------------- */
  function cycleKeyOf(dateStr) { return String(dateStr).slice(0, 7); }

  function addDays(dateStr, n) {
    var dt = new Date(dateStr + 'T00:00:00Z');
    dt.setUTCDate(dt.getUTCDate() + n);
    return dt.toISOString().slice(0, 10);
  }

  function nextCycleStart(dateStr) {
    var y = parseInt(dateStr.slice(0, 4), 10);
    var mo = parseInt(dateStr.slice(5, 7), 10);
    mo += 1; if (mo > 12) { mo = 1; y += 1; }
    return y + '-' + String(mo).padStart(2, '0') + '-01';
  }

  /* ----------------------------- prng (mulberry32) ------------------------ */
  function hashString(s) {
    var h = 1779033703 ^ s.length;
    for (var i = 0; i < s.length; i++) {
      h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ----------------------------- license credits -------------------------- */
  function seatPoolCredits(user) {
    return user.licenseType === 'CopilotEnterprise' ? C.CE_INCLUDED_CREDITS : C.CB_INCLUDED_CREDITS;
  }
  function seatIncludedCredits(user) {
    return user.licenseType === 'CopilotEnterprise' ? C.CE_INCLUDED_CREDITS : C.CB_INCLUDED_CREDITS;
  }

  function totalPoolCredits(state) {
    return state.users.reduce(function (sum, u) { return sum + seatPoolCredits(u); }, 0);
  }

  /* ----------------------------- lookups ---------------------------------- */
  function findUser(state, id) { return state.users.filter(function (u) { return u.id === id; })[0] || null; }
  function findOrg(state, id) { return state.organizations.filter(function (o) { return o.id === id; })[0] || null; }
  function findCostCenter(state, id) { return state.costCenters.filter(function (c) { return c.id === id; })[0] || null; }

  function seatBillingOrg(state, user) {
    var orgs = user.assigningOrgIds || [];
    if (orgs.length === 0) return null;
    if (orgs.length === 1) return orgs[0];
    var assigned = state.runtime.multiOrgAssignment[user.id];
    return assigned || orgs[0];
  }

  // Cost-center membership: direct > enterprise team (oldest) > organization.
  function resolveCostCenter(state, user) {
    var direct = state.costCenters.filter(function (c) { return (c.memberUserIds || []).indexOf(user.id) !== -1; });
    if (direct.length) return { cc: direct[0], via: 'direct' };

    var teams = (state.enterpriseTeams || []).filter(function (t) {
      return t.costCenterId && (t.memberUserIds || []).indexOf(user.id) !== -1;
    });
    if (teams.length) {
      teams.sort(function (a, b) { return String(a.createdAt).localeCompare(String(b.createdAt)); });
      var cc = findCostCenter(state, teams[0].costCenterId);
      if (cc) return { cc: cc, via: 'enterprise team (' + teams[0].name + ', oldest)' };
    }

    var org = seatBillingOrg(state, user);
    if (org) {
      var byOrg = state.costCenters.filter(function (c) { return (c.memberOrgIds || []).indexOf(org) !== -1; });
      if (byOrg.length) return { cc: byOrg[0], via: 'organization (' + org + ')' };
    }
    return { cc: null, via: 'none' };
  }

  function includedCap(state, cc) {
    var ids = new Set(cc.memberUserIds || []);
    (state.enterpriseTeams || []).forEach(function (t) {
      if (t.costCenterId === cc.id) (t.memberUserIds || []).forEach(function (u) { ids.add(u); });
    });
    (cc.memberOrgIds || []).forEach(function (org) {
      state.users.forEach(function (u) { if ((u.assigningOrgIds || []).indexOf(org) !== -1) ids.add(u.id); });
    });
    var cap = 0;
    ids.forEach(function (uid) { var u = findUser(state, uid); if (u) cap += seatIncludedCredits(u); });
    return cap;
  }

  function resolveEffectiveUlb(state, user, cc) {
    if (user.individualUlbUsd !== null && user.individualUlbUsd !== undefined)
      return { value: user.individualUlbUsd, type: 'individual', ruleRef: 'R6-ulb-precedence' };
    if (cc && cc.userLevelBudgetUsd !== null && cc.userLevelBudgetUsd !== undefined)
      return { value: cc.userLevelBudgetUsd, type: 'cost center', ruleRef: 'R6-ulb-precedence' };
    var ent = state.enterprise;
    if (ent.universalUlbUsd !== null && ent.universalUlbUsd !== undefined)
      return { value: ent.universalUlbUsd, type: 'universal', ruleRef: 'R6-ulb-precedence' };
    return null;
  }

  /* ----------------------------- model selection & cost ------------------- */
  function modelFamilies() {
    var seen = {}; var out = [];
    DATA.MODELS.forEach(function (m) { if (!seen[m.name]) { seen[m.name] = true; out.push(m.name); } });
    return out;
  }

  function selectModel(name, inputTokens) {
    var variants = DATA.MODELS.filter(function (m) { return m.name === name; });
    if (!variants.length) return null;
    if (variants.length === 1) return variants[0];
    var def = variants.filter(function (v) { return v.tier === 'Default'; })[0] || variants[0];
    var lng = variants.filter(function (v) { return v.tier === 'Long context'; })[0];
    if (lng && def.thresholdInputTokens != null && inputTokens > def.thresholdInputTokens) return lng;
    return def;
  }

  function computeCost(state, request) {
    var model = selectModel(request.modelName, request.inputTokens || 0);
    if (!model) return null;
    var inP = model.inputPricePerMillion, cP = model.cachedInputPricePerMillion;
    var cwP = model.cacheWritePricePerMillion || 0, oP = model.outputPricePerMillion;
    var baseUsd = ((request.inputTokens || 0) * inP
      + (request.cachedTokens || 0) * cP
      + (request.cacheWriteTokens || 0) * cwP
      + (request.outputTokens || 0) * oP) / 1e6;

    var settings = state.settings || {};
    var afterDiscount = baseUsd, discountApplied = false;
    if (settings.enableAutoModelDiscount && request.autoModel) {
      afterDiscount = baseUsd * (1 - C.AUTO_MODEL_DISCOUNT); discountApplied = true;
    }
    var finalUsd = afterDiscount, residencyApplied = false;
    if (settings.enableDataResidency && request.dataResident) {
      finalUsd = afterDiscount * C.DATA_RESIDENCY_MULTIPLIER; residencyApplied = true;
    }
    var credits = finalUsd / C.CREDIT_TO_USD;
    return {
      model: model, baseUsd: baseUsd, afterDiscount: afterDiscount, finalUsd: finalUsd,
      credits: credits, discountApplied: discountApplied, residencyApplied: residencyApplied
    };
  }

  /* ----------------------------- alerts ----------------------------------- */
  function checkBudgetAlerts(runtime, key, label, scope, consumedUsd, amountUsd, dateStr, caveat) {
    var out = [];
    if (!amountUsd || amountUsd <= 0) return out;
    var ratio = consumedUsd / amountUsd;
    var fired = runtime.alertsFired[key] || [];
    C.ALERT_THRESHOLDS_BUDGET.forEach(function (t) {
      if (ratio >= t - 1e-9 && fired.indexOf(t) === -1) {
        fired.push(t);
        out.push({ ts: dateStr, key: key, label: label, scope: scope, threshold: t,
          ratio: ratio, consumedUsd: consumedUsd, amountUsd: amountUsd, caveat: caveat || null });
      }
    });
    runtime.alertsFired[key] = fired;
    return out;
  }

  /* ----------------------------- runtime lifecycle ------------------------ */
  function freshRuntime(state, dateStr) {
    var rt = {
      cycleKey: cycleKeyOf(dateStr),
      poolTotalCredits: totalPoolCredits(state),
      sharedPoolConsumedCredits: 0,
      ccIncludedConsumed: {},
      userConsumedUsd: {},
      ccMeteredUsd: {},
      orgMeteredUsd: {},
      entMeteredUsd: 0,
      globalMeteredUsd: 0,
      multiOrgAssignment: {},
      alertsFired: {}
    };
    assignMultiOrg(state, rt, dateStr);
    return rt;
  }

  function assignMultiOrg(state, rt, dateStr) {
    state.users.forEach(function (u) {
      var orgs = u.assigningOrgIds || [];
      if (orgs.length > 1) {
        var rng = mulberry32(hashString((state.meta.seed || 'seed') + ':' + rt.cycleKey + ':' + u.id));
        var idx = Math.floor(rng() * orgs.length) % orgs.length;
        rt.multiOrgAssignment[u.id] = orgs[idx];
      }
    });
  }

  // Ensure runtime exists and matches the current cycle. Returns new state if
  // a reset occurred (unused credits forfeited). Pure: returns a state object.
  function ensureCycle(state) {
    var key = cycleKeyOf(state.clock.currentDateUtc);
    if (state.runtime && state.runtime.cycleKey === key) return state;
    var next = shallowCloneState(state);
    next.runtime = freshRuntime(next, next.clock.currentDateUtc);
    return next;
  }

  /* ----------------------------- clone helpers ---------------------------- */
  function shallowCloneState(state) {
    return {
      meta: Object.assign({}, state.meta),
      clock: Object.assign({}, state.clock),
      settings: Object.assign({}, state.settings),
      enterprise: state.enterprise,
      organizations: state.organizations,
      costCenters: state.costCenters,
      enterpriseTeams: state.enterpriseTeams,
      users: state.users,
      runtime: state.runtime,
      events: state.events,
      alerts: state.alerts
    };
  }
  function cloneRuntime(rt) { return JSON.parse(JSON.stringify(rt)); }

  /* ----------------------------- main evaluation -------------------------- */
  // Returns { state: newState, result }. Does not mutate the input state.
  function simulateRequest(inState, request) {
    var state = ensureCycle(inState);
    var user = findUser(state, request.userId);
    var now = state.clock.currentDateUtc;

    var base = {
      ts: now, request: request, userLogin: user ? user.login : request.userId,
      feature: request.feature, sources: [], events: [], alerts: []
    };

    var feature = DATA.FEATURES.filter(function (f) { return f.id === request.feature; })[0];
    if (feature && feature.consumesCredits === false) {
      var res0 = Object.assign({}, base, {
        outcome: 'UnlimitedFeature', costCredits: 0, costUsd: 0,
        message: feature.label + ' is unlimited on paid plans and does not consume AI credits.',
        ruleRefs: ['R1-unlimited-completions']
      });
      return { state: logOnly(state, res0), result: res0 };
    }

    if (!user) {
      var resNoUser = Object.assign({}, base, { outcome: 'Error', costCredits: 0, costUsd: 0, message: 'Unknown user.', ruleRefs: [] });
      return { state: state, result: resNoUser };
    }

    var cost = computeCost(state, request);
    if (!cost) {
      var resNoModel = Object.assign({}, base, { outcome: 'Error', costCredits: 0, costUsd: 0, message: 'Unknown model.', ruleRefs: [] });
      return { state: state, result: resNoModel };
    }

    var rt = cloneRuntime(state.runtime);
    var membership = resolveCostCenter(state, user);
    var cc = membership.cc;
    var costUsd = cost.finalUsd;
    var credits = cost.credits;

    var breakdown = {
      modelName: cost.model.name, tier: cost.model.tier, provider: cost.model.provider,
      baseUsd: cost.baseUsd, finalUsd: cost.finalUsd, credits: credits,
      discountApplied: cost.discountApplied, residencyApplied: cost.residencyApplied,
      membershipVia: membership.via, costCenter: cc ? cc.name : null
    };

    // 1) User-level budget (hard stop, pool + metered phases).
    var ulb = resolveEffectiveUlb(state, user, cc);
    var priorUserUsd = rt.userConsumedUsd[user.id] || 0;
    if (ulb) {
      if (priorUserUsd + costUsd > ulb.value + 1e-9) {
        var resUlb = Object.assign({}, base, {
          outcome: 'BlockedByUserLevelBudget', costCredits: credits, costUsd: costUsd, breakdown: breakdown,
          message: 'Blocked: ' + ulb.type + ' user-level budget of $' + ulb.value.toFixed(2)
            + ' would be exceeded (used $' + priorUserUsd.toFixed(4) + ' + $' + costUsd.toFixed(4) + ').',
          ruleRefs: ['R6-ulb-precedence'], ulb: ulb
        });
        return { state: appendLog(state, rt, resUlb), result: resUlb };
      }
    }

    // 2) Pool phase.
    var includedControl = cc && cc.includedUsageControl && cc.includedUsageControl.enabled;
    var servedFromPool = false;
    var poolInfo = {};
    if (includedControl) {
      var cap = includedCap(state, cc);
      var ccConsumed = rt.ccIncludedConsumed[cc.id] || 0;
      poolInfo = { mode: 'cost-center included cap', cap: cap, consumed: ccConsumed };
      if (ccConsumed + credits <= cap + 1e-9) {
        rt.ccIncludedConsumed[cc.id] = ccConsumed + credits;
        rt.sharedPoolConsumedCredits += credits;
        servedFromPool = true;
      } else if (cc.includedUsageControl.onCapReached === 'block') {
        rt.userConsumedUsd[user.id] = priorUserUsd; // no consumption
        var resInc = Object.assign({}, base, {
          outcome: 'BlockedByIncludedUsageControl', costCredits: credits, costUsd: costUsd, breakdown: breakdown,
          message: 'Blocked: cost center "' + cc.name + '" reached its AI credit pool cap ('
            + fmtInt(cap) + ' credits) and is set to block.',
          ruleRefs: ['R7-included-usage-control', 'R8-included-cap-formula'], poolInfo: poolInfo
        });
        return { state: appendLog(state, rt, resInc), result: resInc };
      }
      // else paidOverage -> fall through to metered phase.
    } else {
      var poolTotal = rt.poolTotalCredits;
      poolInfo = { mode: 'shared enterprise pool', cap: poolTotal, consumed: rt.sharedPoolConsumedCredits };
      if (rt.sharedPoolConsumedCredits + credits <= poolTotal + 1e-9) {

    if (servedFromPool) {
      rt.userConsumedUsd[user.id] = priorUserUsd + costUsd;
      var resPool = Object.assign({}, base, {
        outcome: 'ServedFromPool', costCredits: credits, costUsd: costUsd, breakdown: breakdown,
        message: 'Served from ' + poolInfo.mode + ' (' + fmtInt(credits) + ' credits). No metered charge.',
        ruleRefs: ['R4-shared-pool'].concat(includedControl ? ['R7-included-usage-control'] : []),
        poolInfo: poolInfo, ulb: ulb
      });
      // ULB alerts (flagged as not consistently available).

      commitAlerts(state, resPool);
      return { state: appendLog(state, rt, resPool), result: resPool };
    }

    // 3) Metered gate: paid usage policy.
    if (!state.enterprise.aiCreditPaidUsagePolicyEnabled) {
      var resPolicy = Object.assign({}, base, {
        outcome: 'BlockedByPaidUsagePolicyOff', costCredits: credits, costUsd: costUsd, breakdown: breakdown,

        ruleRefs: ['R9-paid-usage-policy'], poolInfo: poolInfo

    if (entBudget && !entExcluded) rt.entMeteredUsd += costUsd;

      outcome: 'MeteredCharged', costCredits: credits, costUsd: costUsd, breakdown: breakdown,

      ruleRefs: ['R9-paid-usage-policy', 'R10-metered-order'].concat(entExcluded ? ['R12-cc-exclusion'] : []),
      appliedBudgets: applicable, poolInfo: poolInfo, ulb: ulb, softExceed: applicable.filter(function (b) { return !b.hardStop && b.consumed + costUsd > b.amount; })

      var consumedNow = b.applyTo === 'ent' ? rt.entMeteredUsd : (b.applyTo.indexOf('cc:') === 0 ? rt.ccMeteredUsd[cc.id] : rt.orgMeteredUsd[billingOrg.id]);

  }

        h('ul', null, SC.presets.map(function (p) { return h('li', null, h('strong', null, p.name), ' \u2014 ', p.description, ruleChips(p.sourceRefs)); }))));
  }
  function addUser() { editState(function (ns) { ns.users.push({ id: 'u-' + Date.now(), login: 'newuser', licenseType: 'CopilotBusiness', assigningOrgIds: ns.organizations[0] ? [ns.organizations[0].id] : [], individualUlbUsd: null }); }); }
  function addOrg() { editState(function (ns) { ns.organizations.push({ id: 'org-' + Date.now(), name: 'New org', budget: null }); }); }
  function addCostCenter() { editState(function (ns) { ns.costCenters.push({ id: 'cc-' + Date.now(), name: 'New cost center', memberUserIds: [], memberOrgIds: [], budget: null, userLevelBudgetUsd: null, includedUsageControl: null }); }); }

  /* ---------------------------- alerts & reports -------------------------- */
  function viewReports() {
    var wrap = h('div', null);

    // Alerts
    wrap.appendChild(h('div', { class: 'card' },
      h('div', { class: 'view-header' }, h('h3', null, 'Budget alerts ', docChip('budgets-alerts')),
        h('button', { class: 'btn ghost small', onclick: function () { editStatePreserveClock(function (ns) { ns.alerts = []; }); } }, 'Clear alerts')),
      h('div', { class: 'section-note' }, 'Alerts fire once per threshold (75% / 90% / 100%) per cycle. User-level budget alerts are flagged as not consistently available.'),
      state.alerts.length ? alertsTable() : h('p', { class: 'muted' }, 'No alerts fired yet.')
    ));

    // CSV reports
    wrap.appendChild(h('div', { class: 'card' },
      h('h3', null, 'Usage report exports ', docChip('billing-reports')),
      h('div', { class: 'section-note' }, 'CSVs are generated from simulated events and modeled after GitHub billing exports; exact column parity with live exports is not guaranteed (see Documentation \u2192 Exclusions).'),
      h('div', { class: 'btn-row' },
        h('button', { class: 'btn ghost', onclick: exportSummaryCsv }, 'Summary usage CSV'),
        h('button', { class: 'btn ghost', onclick: exportDetailedCsv }, 'Detailed usage CSV'),
        h('button', { class: 'btn ghost', onclick: exportAiUsageCsv }, 'AI usage (per user/model) CSV')
      )
    ));

    // JSON scenario import/export
    wrap.appendChild(h('div', { class: 'card' },
      h('h3', null, 'Scenario & data'),
      h('div', { class: 'btn-row' },
        h('button', { class: 'btn ghost', onclick: exportStateJson }, 'Export scenario JSON'),
        importButton(),
        h('button', { class: 'btn ghost', onclick: exportTraceability }, 'Download traceability JSON'),
        h('button', { class: 'btn ghost', onclick: exportExclusions }, 'Download exclusions (Markdown)')
      ),
      h('div', { id: 'import-msg', class: 'section-note', style: 'margin-top:0.6rem' })
    ));

    return wrap;
  }
  function alertsTable() {
    return h('div', { class: 'table-wrap' }, h('table', null,
      h('thead', null, h('tr', null, ['Date', 'Scope', 'Budget', 'Threshold', 'Utilization', 'Note'].map(function (t) { return h('th', null, t); }))),
      h('tbody', null, state.alerts.slice().reverse().map(function (a) {
        return h('tr', null,
          h('td', { class: 'nowrap' }, a.ts),
          h('td', null, a.scope),
          h('td', null, a.label),
          h('td', null, badge(pct(a.threshold), a.threshold >= 1 ? 'block' : 'warn')),
          h('td', { class: 'nowrap' }, pct(a.ratio) + ' (' + usd(a.consumedUsd) + '/' + usd(a.amountUsd) + ')'),
          h('td', null, a.caveat ? h('small', { class: 'muted' }, a.caveat) : '')
        );
      }))
    ));
  }

  /* -------------------------------- reports data -------------------------- */
  function detailedRows() {
    return state.events.map(function (ev) {
      var b = ev.breakdown || {};
      return {
        Date: ev.ts, User: ev.userLogin, Feature: ev.feature,
        Model: b.modelName || '', Tier: b.tier || '', Provider: b.provider || '',
        CostCenter: b.costCenter || '', Outcome: ev.outcome,
        Credits: round(ev.costCredits, 4), NetUSD: round(ev.costUsd, 6)
      };
    });
  }
  function exportDetailedCsv() {
    var rows = detailedRows();
    downloadCsv('copilot-detailed-usage.csv',
      ['Date', 'User', 'Feature', 'Model', 'Tier', 'Provider', 'CostCenter', 'Outcome', 'Credits', 'NetUSD'], rows);
  }
  function exportSummaryCsv() {
    var map = {};
    state.events.forEach(function (ev) {
      var b = ev.breakdown || {};
      var key = (b.modelName || ev.feature) + '|' + ev.outcome;
      if (!map[key]) map[key] = { Product: 'GitHub Copilot', Model: b.modelName || '(n/a)', Outcome: ev.outcome, Requests: 0, Credits: 0, NetUSD: 0 };
      map[key].Requests += 1; map[key].Credits += ev.costCredits || 0; map[key].NetUSD += ev.costUsd || 0;
    });
    var rows = Object.keys(map).map(function (k) { var r = map[k]; r.Credits = round(r.Credits, 4); r.NetUSD = round(r.NetUSD, 6); return r; });
    downloadCsv('copilot-summary-usage.csv', ['Product', 'Model', 'Outcome', 'Requests', 'Credits', 'NetUSD'], rows);
  }
  function exportAiUsageCsv() {
    var map = {};
    state.events.forEach(function (ev) {
      var b = ev.breakdown || {}; if (!b.modelName) return;
      var key = ev.userLogin + '|' + b.modelName;
      if (!map[key]) map[key] = { User: ev.userLogin, Model: b.modelName, Requests: 0, Credits: 0, NetUSD: 0 };
      map[key].Requests += 1; map[key].Credits += ev.costCredits || 0; map[key].NetUSD += ev.costUsd || 0;
    });
    var rows = Object.keys(map).map(function (k) { var r = map[k]; r.Credits = round(r.Credits, 4); r.NetUSD = round(r.NetUSD, 6); return r; });
    downloadCsv('copilot-ai-usage.csv', ['User', 'Model', 'Requests', 'Credits', 'NetUSD'], rows);
  }
  function round(n, d) { var f = Math.pow(10, d); return Math.round((Number(n) || 0) * f) / f; }
  function toCsv(headers, rows) {
    var esc = function (v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var lines = [headers.map(esc).join(',')];
    rows.forEach(function (r) { lines.push(headers.map(function (hd) { return esc(r[hd]); }).join(',')); });
    return lines.join('\r\n');
  }
  function downloadCsv(name, headers, rows) {
    if (!rows.length) { alert('No events to export yet — run some requests first.'); return; }
    download(name, toCsv(headers, rows), 'text/csv');
  }
  function exportStateJson() { download('copilot-billing-scenario.json', JSON.stringify({ __v: 1, state: stripRuntime(state) }, null, 2), 'application/json'); }
  function stripRuntime(s) { var c = SC.clone(s); c.runtime = null; c.events = []; c.alerts = []; return c; }
  function exportTraceability() {
    var out = { generatedAt: new Date().toISOString(), constants: DATA.CONSTANTS, docs: DATA.DOCS, rules: DATA.RULES, models: DATA.MODELS };
    download('copilot-billing-traceability.json', JSON.stringify(out, null, 2), 'application/json');
  }
  function exportExclusions() {
    var md = '# Not documented \u2014 excluded from the simulator\n\n';
    md += 'Generated ' + new Date().toISOString() + '. Behavior below is intentionally not simulated or is flagged as unverified.\n\n';
    DATA.EXCLUSIONS.forEach(function (x) {
      md += '## ' + x.title + '\n\n' + x.note + '\n\n';
      if (x.sourceRefs && x.sourceRefs.length) {
        md += 'Sources:\n';
        x.sourceRefs.forEach(function (r) { if (r.url) md += '- [' + (r.title || r.url) + '](' + r.url + ')\n'; });
        md += '\n';
      }
    });
    download('copilot-billing-exclusions.md', md, 'text/markdown');
  }
  function importButton() {
    var input = h('input', { type: 'file', accept: '.json,application/json', class: 'hidden', onchange: function (e) {
      var file = e.target.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var msg = document.getElementById('import-msg');
        try {
          var obj = JSON.parse(reader.result);
          var st = obj && obj.state ? obj.state : obj;
          var err = validateState(st);
          if (err) { if (msg) { msg.textContent = 'Import failed: ' + err; msg.style.color = 'var(--cp-danger)'; } return; }
          if (!st.runtime) st = E.ensureCycle(st);
          if (msg) { msg.textContent = 'Scenario imported successfully.'; msg.style.color = 'var(--cp-success)'; }
          commit(st);
        } catch (ex) {
          if (msg) { msg.textContent = 'Import failed: invalid JSON.'; msg.style.color = 'var(--cp-danger)'; }
        }
      };
      reader.readAsText(file);
    } });
    var btn = h('button', { class: 'btn ghost', onclick: function () { input.click(); } }, 'Import scenario JSON');
    return h('span', null, btn, input);
  }
  function validateState(st) {
    if (!st || typeof st !== 'object') return 'not an object';
    if (!st.enterprise) return 'missing enterprise';
    if (!Array.isArray(st.users)) return 'missing users array';
    if (!Array.isArray(st.organizations)) return 'missing organizations array';
    if (!Array.isArray(st.costCenters)) return 'missing costCenters array';
    if (!st.clock || !st.clock.currentDateUtc) return 'missing clock';
    return null;
  }

  /* ------------------------------ documentation --------------------------- */
  function viewDocs() {
    var wrap = h('div', null);
    wrap.appendChild(h('div', { class: 'banner info' }, 'This simulator is grounded in current GitHub documentation. Every rule links to its source. Behavior that is undocumented or unverified is listed under Exclusions rather than invented.'));

    // Docs catalog
    var docKeys = Object.keys(DATA.DOCS);
    wrap.appendChild(h('div', { class: 'card' },
      h('h3', null, 'Documentation catalog (' + docKeys.length + ')'),
      h('div', { class: 'table-wrap' }, h('table', null,
        h('thead', null, h('tr', null, ['#', 'Title', 'Link'].map(function (t) { return h('th', null, t); }))),
        h('tbody', null, docKeys.map(function (k) {
          var d = DATA.DOCS[k];
          return h('tr', null, h('td', null, d.id), h('td', null, d.title), h('td', null, h('a', { href: d.url, target: '_blank', rel: 'noopener' }, d.url)));
        }))
      ))
    ));

    // Rules
    wrap.appendChild(h('div', { class: 'card' },
      h('h3', null, 'Rule catalog & traceability (' + DATA.RULES.length + ')'),
      DATA.RULES.map(function (r) {
        return h('details', { class: 'rule' },
          h('summary', null, r.id + ' — ' + r.title),
          (r.sourceRefs || []).map(function (ref) {
            return h('div', null,
              ref.excerpt ? h('div', { class: 'excerpt' }, '\u201C' + ref.excerpt + '\u201D') : null,
              ref.url ? h('a', { href: ref.url, target: '_blank', rel: 'noopener' }, ref.title || ref.url) : h('span', { class: 'muted' }, ref.title || ''));
          })
        );
      })
    ));

    // Exclusions
    wrap.appendChild(h('div', { class: 'card' },
      h('div', { class: 'view-header' }, h('h3', null, 'Not documented \u2014 excluded (' + DATA.EXCLUSIONS.length + ')'),
        h('button', { class: 'btn ghost small', onclick: exportExclusions }, 'Download Markdown')),
      DATA.EXCLUSIONS.map(function (x) {
        return h('div', { class: 'card', style: 'background:var(--cp-surface-soft);margin-bottom:0.6rem' },
          h('strong', null, x.title),
          h('p', { style: 'margin:0.3rem 0' }, x.note),
          (x.sourceRefs || []).length ? h('div', { class: 'tag-list' }, x.sourceRefs.map(function (r) { return r.key ? docChip(r.key) : null; })) : h('small', { class: 'muted' }, 'No supporting citation.'));
      })
    ));

    // Model catalog
    wrap.appendChild(h('div', { class: 'card' },
      h('h3', null, 'Model pricing catalog ', docChip('models-pricing')),
      h('div', { class: 'section-note' }, 'USD per 1,000,000 tokens. 1 AI credit = $0.01. Verified 2026-07-23.'),
      h('div', { class: 'table-wrap' }, h('table', null,
        h('thead', null, h('tr', null, ['Provider', 'Model', 'Tier', 'Input', 'Cached', 'Cache write', 'Output', 'Status'].map(function (t) { return h('th', null, t); }))),
        h('tbody', null, DATA.MODELS.map(function (m) {
          return h('tr', null, h('td', null, m.provider), h('td', null, m.name), h('td', null, m.tier),
            h('td', null, usd(m.inputPricePerMillion)), h('td', null, usd(m.cachedInputPricePerMillion)),
            h('td', null, m.cacheWritePricePerMillion == null ? '—' : usd(m.cacheWritePricePerMillion)),
            h('td', null, usd(m.outputPricePerMillion)), h('td', null, h('small', null, m.releaseStatus)));
        }))
      ))
    ));

    return wrap;
  }

  /* ------------------------------ small builders -------------------------- */
  function stat(label, value, sub, chip) { return h('div', { class: 'stat' }, h('div', { class: 'label' }, label, chip ? [' ', chip] : null), h('div', { class: 'value' }, value), sub ? h('div', { class: 'sub' }, sub) : null); }
  function kvTile(label, value) { return h('div', null, h('div', { class: 'label muted', style: 'font-size:0.75rem;text-transform:uppercase' }, label), h('div', { style: 'font-weight:600;margin-top:0.15rem' }, value)); }
  function field(label, control, chip) { return h('label', { class: 'field' }, h('span', null, label, chip ? [' ', chip] : null), control); }
  function textInput(val, onChange) { return h('input', { type: 'text', value: val || '', onchange: function (e) { onChange(e.target.value); } }); }
  function numFieldInput(val, onChange) { return h('input', { type: 'number', step: 'any', min: '0', value: val == null ? '' : val, onchange: function (e) { onChange(parseNum(e.target.value)); } }); }
  function numInputVal(val, onChange) { return h('input', { type: 'number', step: 'any', min: '0', value: val == null ? '' : val, onchange: function (e) { onChange(Number(e.target.value)); } }); }
  function opt(value, label, selected) { return h('option', { value: value, selected: selected ? 'selected' : null }, label); }
  function badge(text, cls) { return h('span', { class: 'badge ' + (cls || 'neutral') }, text); }
  function shortLic(t) { return t === 'CopilotEnterprise' ? 'CE' : 'CB'; }
  function outcomeBadge(o) {
    var cls = o === 'MeteredCharged' ? 'meter' : (o === 'ServedFromPool' || o === 'UnlimitedFeature' ? 'ok' : (o === 'Error' ? 'neutral' : 'block'));
    return badge(humanOutcome(o), cls);
  }
  function humanOutcome(o) {
    return ({
      ServedFromPool: 'Served from pool', MeteredCharged: 'Metered charge', UnlimitedFeature: 'Unlimited feature',
      BlockedByUserLevelBudget: 'Blocked — user budget', BlockedByIncludedUsageControl: 'Blocked — included cap',
      BlockedByPaidUsagePolicyOff: 'Blocked — paid usage off', BlockedByCostCenterBudget: 'Blocked — cost center',
      BlockedByOrganizationBudget: 'Blocked — organization', BlockedByEnterpriseBudget: 'Blocked — enterprise', Error: 'Error'
    })[o] || o;
  }
  function editStatePreserveClock(fn) { var ns = SC.clone(state); fn(ns); commit(ns); }

  /* --------------------------------- shell -------------------------------- */
  var NAV = [
    { id: 'home', label: 'Start here', render: viewStartHere },
    { id: 'overview', label: 'Overview', render: viewOverview },
    { id: 'config', label: 'Configuration', render: viewConfig },
    { id: 'simulator', label: 'Simulator', render: viewSimulator },
    { id: 'reports', label: 'Alerts & Reports', render: viewReports },
    { id: 'docs', label: 'Documentation', render: viewDocs }
  ];

  function download(name, text, mime) {
    var blob = new Blob([text], { type: mime || 'text/plain' });
    var url = URL.createObjectURL(blob);
    var a = h('a', { href: url, download: name });
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
  }

  function toggleTheme() {
    var cur = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  }

  function render() {
    state = E.ensureCycle(state);
    var root = document.getElementById('app');
    clear(root);

    var nav = h('nav', { class: 'sidebar' },
      h('div', { class: 'brand' }, h('span', { class: 'dot' }), h('strong', null, 'Copilot Billing Simulator')),
      NAV.map(function (n) { return h('button', { class: 'nav-btn' + (n.id === activeView ? ' active' : ''), onclick: function () { activeView = n.id; render(); } }, n.label); }),
      h('div', { class: 'spacer' }),
      h('button', { class: 'nav-btn', onclick: toggleTheme }, 'Toggle theme'),
      h('div', { class: 'section-note', style: 'padding:0 0.7rem' }, 'Unofficial educational tool — not affiliated with or endorsed by Microsoft or GitHub. See the disclaimer at the bottom of the page.')
    );

    var view = (NAV.filter(function (n) { return n.id === activeView; })[0] || NAV[0]);
    var main = h('main', { class: 'main' },
      h('div', { class: 'view-header' }, h('h1', null, view.label), h('div', { class: 'muted' }, state.enterprise.name + ' • ' + state.clock.currentDateUtc)),
      view.render(),
      disclaimerFooter()
    );

    root.appendChild(h('div', { class: 'app' }, nav, main));
    if (budgetModal) root.appendChild(renderBudgetModal());
  }

  render();
})();

</script>
</body>
</html>
